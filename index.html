<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MasMas Picks</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <img
            src="assets/logo/logo.png"
            class="logo-img"
            alt="MasMas Picks"
        >
    </header>


    <!-- HERO -->
    <section class="hero">

        <span class="badge">
            Trusted Product Recommendation
        </span>

        <h1>
            We only recommend
            products worth buying.
        </h1>

        <p>
            Temukan rekomendasi pilihan untuk
            ACC Motor, Coffee Gear,
            dan Produk Digital.
        </p>

        <a href="#produk" class="explore">
            Explore Picks
        </a>

    </section>


    <!-- SEARCH -->
    <section class="search">

        <input
            type="text"
            id="search"
            placeholder="🔍 Cari produk favoritmu..."
            autocomplete="off"
        >

    </section>


    <!-- KATEGORI -->
    <section class="kategori">

        <button data-category="All">
            Semua
        </button>

        <button data-category="Ride">
            🏍 Ride
        </button>

        <button data-category="Brew">
            ☕ Brew
        </button>

        <button data-category="Digital">
            💻 Digital
        </button>

    </section>


    <!-- JUDUL PRODUK -->
    <section class="judul">
        🔥 Pilihan MasMas
    </section>


    <!-- PRODUK -->
    <section
        class="produk"
        id="produk"
    >
        <!-- Produk akan otomatis dimuat oleh app.js -->
    </section>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 MasMas Picks
        </p>

        <p>
            Trusted Product Recommendation
            • Affiliate Disclosure
        </p>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="js/app.js"></script>

</body>
</html>
